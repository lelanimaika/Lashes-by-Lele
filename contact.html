
<!DOCTYPE html>

<head>

<style>
* {

}

body {
margin: 0;
font-family: 'Poppins', sans-serif;
background: linear-gradient(120deg, #fff7ad, #ffa9f9, #ffe0f2);

.header {

}

.logo {

margin: 0 auto 10px;
display: flex;
align-items: center;

.header h1 {

font-size: 42px;
letter-spacing: 3px;

}

.header p {
font-size: 15px;
font-weight: 600;

}

.nav {
background: linear-gradient(90deg, #fff7ad, #ffa9f9);
padding: 18px 10px;
text-align: center;
border-bottom: 2px solid #e94cae;
}

.nav a {
display: inline-block;
padding: 10px 16px;
color: black;
text-decoration: none;
font-size: 16px;
font-weight: 600;
border-radius: 20px;
}

.nav a:hover {
background: #ff66c4;
}

.contact-section {
padding: 30px 8% 50px;
}

.contact-section h2 {
font-family: 'Playfair Display', serif;
font-size: 42px;
text-align: center;
margin-bottom: 35px;
text-decoration: underline;
text-decoration-color: #ff66c4;
text-underline-offset: 10px;
}

.contact-container {
display: flex;
justify-content: space-between;
gap: 50px;
max-width: 1000px;
margin: 0 auto;
}

.contact-info {
width: 45%;
}

.contact-info h3,
.contact-form h3 {
font-family: 'Playfair Display', serif;
font-size: 28px;
margin-bottom: 20px;
}

.contact-info p {
font-family: 'Cormorant Garamond', serif;
font-size: 23px;
font-weight: 600;
margin-bottom: 22px;
}

.contact-info a {
color: black;
text-decoration: none;
}

.contact-info a:hover {
color: #d62b91;
text-decoration: underline;
}

.contact-form {
width: 50%;
background: rgba(255,255,255,0.55);
padding: 25px;
border-radius: 15px;
box-shadow: 0 5px 15px rgba(0,0,0,0.15);
}

.form-group {
margin-bottom: 18px;
}

.form-group input,
.form-group textarea {
width: 100%;
padding: 13px;
border: 1px solid #e94cae;
border-radius: 8px;
font-family: 'Poppins', sans-serif;
font-size: 14px;
}

.form-group textarea {
height: 130px;
resize: vertical;
}

.form-group input:focus,
.form-group textarea:focus {
outline: 2px solid #ff66c4;
}

.send-button {
background: black;
color: white;
border: none;
padding: 13px 30px;
border-radius: 25px;
font-family: 'Poppins', sans-serif;
font-size: 15px;
font-weight: 600;
cursor: pointer;
}

.send-button:hover {
background: #ff66c4;
color: black;
}

.footer {
background: #ff66c4;
padding: 20px;
text-align: center;
font-size: 14px;
font-weight: 600;
}

@media (max-width: 600px) {

font-size: 30px;
}

.header p {
font-size: 11px;
letter-spacing: 2px;
}

.nav a {
font-size: 13px;
padding: 8px;
}

.contact-section h2 {
font-size: 32px;
}

.contact-container {
flex-direction: column;
gap: 20px;
}

.contact-info,
.contact-form {

}

<body>

<div class="header">
<div class="logo">LL</div>
<h1>LASHES BY LELE</h1>
<p>BEAUTY. CONFIDENCE. ELEGANCE.</p>

<div class="nav">

<div class="contact-section">

<div class="contact-container">

</div>

<div class="footer">

</div>

<script>
function sendMessage(event) {
event.preventDefault();

var name = document.getElementById("name").value;
var email = document.getElementById("email").value;
var message = document.getElementById("message").value;

var text = "Hello Lashes by Lele!%0A%0AName: " + encodeURIComponent(name) + "%0AEmail: " + encodeURIComponent(email) + "%0AMessage: " + encodeURIComponent(message);

window.open("https://wa.me/26777053851?text=" + text, "_blank");
}
</script>
